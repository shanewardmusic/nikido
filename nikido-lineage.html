alse,"color":"#334155","align":"center"},"note":{"font":"Arial","size":12,"bold":false,"italic":false,"color":"#475569","align":"center"}},"profile":{"summary":"Bruce K. Watts is identified with the Wind School of Ju-Jitsu in Belmore and as a senior Australian teacher involved in the formation of the Australian Jujitsu Association in the mid-1980s. Bruce K. Watts taught Alfred E. Ward, who went on to found Nikido Ju Jutsu. This teaching relationship forms the immediate connection between the Wind School and Nikido.","sources":[{"label":"Australian Ju Jitsu Association — history","url":"https://www.ajja.au/history-of-the-ajja"},{"label":"Australian Ju Jitsu Association — New South Wales dōjō register","url":"https://www.ajja.au/files/NewSouthWalesDojos1.pdf"},{"label":"Australian Society of Ju-Jitsu — history","url":"https://www.asjj.com.au/about-us"}]}},{"id":"tile-bci7t5znxt9","x":-20.9692549507445,"y":518.1693476709798,"w":407.1301751503338,"h":111.73620913090026,"heading":"Alfred E. Ward","subheading":"Founder: Nikido Ju Jutsu","note":"","bg":"#ffffff","borderColor":"#cbd5e1","borderWidth":1,"radius":18,"padding":18,"text":{"heading":{"font":"Arial","size":20,"bold":true,"italic":false,"color":"#0f172a","align":"center"},"subheading":{"font":"Arial","size":14,"bold":false,"italic":false,"color":"#334155","align":"center"},"note":{"font":"Arial","size":12,"bold":false,"italic":false,"color":"#475569","align":"center"}},"profile":{"summary":"","sources":[]}},{"id":"tile-c91r7l8ol8d","x":-20.969254950744528,"y":-433.8992378454643,"w":407.1301751503338,"h":111.73620913090026,"heading":"Wallace C. \"Wally\" Brown","subheading":"Southern Cross Ju Jutsu","note":"","bg":"#ffffff","borderColor":"#cbd5e1","borderWidth":1,"radius":18,"padding":18,"text":{"heading":{"font":"Arial","size":20,"bold":true,"italic":false,"color":"#0f172a","align":"center"},"subheading":{"font":"Arial","size":14,"bold":false,"italic":false,"color":"#334155","align":"center"},"note":{"font":"Arial","size":12,"bold":false,"italic":false,"color":"#475569","align":"center"}},"profile":{"summary":"Wallace C. “Wally” Brown is remembered in the Nikido teaching line between Leonard Noyes and Bruce Watts. His surviving public biography is limited, a common problem for local teachers whose work lives mainly in club records and student memory. Australian association history independently records Brown within the wider jūjutsu community of the period.","sources":[{"label":"Australian Ju Jitsu Association — history","url":"https://www.ajja.au/history-of-the-ajja"},{"label":"Australian Society of Ju-Jitsu — history","url":"https://www.asjj.com.au/about-us"},{"label":"The Martial Chronicles — jiu-jitsu comes to Australia","url":"https://www.cagesideseats.com/2012/11/4/3599474/the-martial-chronicles-jiu-jitsu-conquers-australia"}]}},{"id":"tile-642lnhcpeqf","x":-20.969254950744528,"y":-624.9248625553892,"w":407.1301751503338,"h":111.73620913090026,"heading":"Leonard \"Len\" Noyes","subheading":"A.K.A. Sid Neal; 1903 - 1991; Founder: Mercury Jujitsu Club in 1938","note":"","bg":"#ffffff","borderColor":"#cbd5e1","borderWidth":1,"radius":18,"padding":18,"text":{"heading":{"font":"Arial","size":20,"bold":true,"italic":false,"color":"#0f172a","align":"center"},"subheading":{"font":"Arial","size":14,"bold":false,"italic":false,"color":"#334155","align":"center"},"note":{"font":"Arial","size":12,"bold":false,"italic":false,"color":"#475569","align":"center"}},"profile":{"summary":"Leonard “Len” Noyes (1903–1991), also recorded under the professional alias Sid Neil or Sid Neal, is remembered as Fukushima’s student and the founder of the Mercury Jiu-Jitsu Club in 1938. Australian accounts describe a broad curriculum including weapons, multiple attacks, groundwork, limb locks and pressure points.","sources":[{"label":"Australian Society of Ju-Jitsu — history","url":"https://www.asjj.com.au/about-us"},{"label":"Australian Ju Jitsu Association — history","url":"https://www.ajja.au/history-of-the-ajja"},{"label":"The Martial Chronicles — jiu-jitsu comes to Australia","url":"https://www.cagesideseats.com/2012/11/4/3599474/the-martial-chronicles-jiu-jitsu-conquers-australia"},{"label":"Te Ara — martial arts in New Zealand","url":"https://teara.govt.nz/en/martial-arts/print"}]}},{"id":"tile-ejzx35ys2oa","x":-20.969254950744528,"y":-815.950487265314,"w":407.1301751503338,"h":111.73620913090026,"heading":"Ryugoro Fukushima / Ray Shima","subheading":"1885 - 1958; Hagiwara School","note":"Came to Australia in 1906","bg":"#ffffff","borderColor":"#cbd5e1","borderWidth":1,"radius":18,"padding":18,"text":{"heading":{"font":"Arial","size":20,"bold":true,"italic":false,"color":"#0f172a","align":"center"},"subheading":{"font":"Arial","size":14,"bold":false,"italic":false,"color":"#334155","align":"center"},"note":{"font":"Arial","size":12,"bold":false,"italic":false,"color":"#475569","align":"center"}},"profile":{"summary":"Fukushima Ryūgorō, later known as Ray Shima (born about 1885 or 1888; died 1958), arrived in Australia in 1906 and became an important early public demonstrator and teacher of Japanese grappling. Contemporary promotion cited long training at a Hagiwara School. Australian lineage records identify Leonard Noyes as his student; Fukushima later settled in New Zealand.","sources":[{"label":"Australian Society of Ju-Jitsu — history","url":"https://www.asjj.com.au/about-us"},{"label":"Te Ara — Ray Shima in New Zealand","url":"https://teara.govt.nz/en/martial-arts/print"},{"label":"The Martial Chronicles — Australian newspaper evidence","url":"https://www.cagesideseats.com/2012/11/4/3599474/the-martial-chronicles-jiu-jitsu-conquers-australia"},{"label":"Australian Ju Jitsu Association — history","url":"https://www.ajja.au/history-of-the-ajja"},{"label":"International Research Center for Japanese Studies — martial arts in Australasia","url":"https://nichibun.repo.nii.ac.jp/record/6905/files/symp_023_181.pdf"},{"label":"University of Canterbury — Japanese migrant community in Christchurch","url":"https://hdl.handle.net/10092/974"}]}},{"id":"tile-3d9r81fyqg8","x":-20.969254950744528,"y":-1006.9761119752388,"w":407.1301751503338,"h":111.73620913090026,"heading":"Hagiwara Ryōshinsai / Hiroji\r\n","subheading":"Tenjin Shin’yō-ryū\r\n","note":"","bg":"#ffffff","borderColor":"#cbd5e1","borderWidth":1,"radius":18,"padding":18,"text":{"heading":{"font":"Arial","size":20,"bold":true,"italic":false,"color":"#0f172a","align":"center"},"subheading":{"font":"Arial","size":14,"bold":false,"italic":false,"color":"#334155","align":"center"},"note":{"font":"Arial","size":12,"bold":false,"italic":false,"color":"#475569","align":"center"}},"profile":{"summary":"Nikido’s internal genealogy names Hagiwara Ryōshinsai, also rendered Hiroji, immediately before Fukushima. A contemporary 1906 Australian advertisement states that Fukushima trained for thirteen years at a Hagiwara School in Yokohama and served eight years as head assistant, but it does not identify the instructor’s full name or formal ryū. The connection should therefore remain clearly qualified.","sources":[{"label":"The Martial Chronicles — 1906 newspaper evidence","url":"https://www.cagesideseats.com/2012/11/4/3599474/the-martial-chronicles-jiu-jitsu-conquers-australia"},{"label":"Australian Society of Ju-Jitsu — history","url":"https://www.asjj.com.au/about-us"},{"label":"Nihon Kobudō Kyōkai — Tenjin Shin’yō-ryū","url":"https://www.nihonkobudokyoukai.org/martialarts/005/"},{"label":"Te Ara — martial arts in New Zealand","url":"https://teara.govt.nz/en/martial-arts/print"}]}},{"id":"tile-ql3rnr4zx19","x":-20.969254950744528,"y":-1198.0017366851637,"w":407.1301751503338,"h":111.73620913090026,"heading":"Tozawa Tokusaburō Masayuki\n","subheading":"Tenjin Shin’yō-ryū\r\n","note":"1848 - 1912","bg":"#ffffff","borderColor":"#cbd5e1","borderWidth":1,"radius":18,"padding":18,"text":{"heading":{"font":"Arial","size":20,"bold":true,"italic":false,"color":"#0f172a","align":"center"},"subheading":{"font":"Arial","size":14,"bold":false,"italic":false,"color":"#334155","align":"center"},"note":{"font":"Arial","size":12,"bold":false,"italic":false,"color":"#475569","align":"center"}},"profile":{"summary":"Tozawa Tokusaburō (1848–1912) was a prominent Tenjin Shin’yō-ryū teacher and branch transmitter rather than the fourth formal head. Ueshiba Morihei reportedly studied with him briefly in 1901. Nikido tradition also associates Tozawa’s branch with the Hagiwara school that preceded Fukushima’s Australian transmission.","sources":[{"label":"Aikido Journal — Tokusaburō Tozawa","url":"https://aikidojournal.com/2011/08/27/tokusaburo-tozawa/"},{"label":"Nihon Kobudō Kyōkai — Tenjin Shin’yō-ryū","url":"https://www.nihonkobudokyoukai.org/martialarts/005/"},{"label":"Aikikai Foundation — history of Aikidō","url":"https://aikikai.or.jp/eng/aikido/history/"},{"label":"Kotobank — Tenjin Shin’yō-ryū","url":"https://kotobank.jp/word/%E5%A4%A9%E7%A5%9E%E7%9C%9F%E6%A5%8A%E6%B5%81-102481"}]}},{"id":"tile-jzl8hay10u7","x":-500.0465195398763,"y":-1486.7027281092553,"w":407.1301751503338,"h":111.73620913090026,"heading":"Imaizumi Hachirō\r\n","subheading":"Founder: Shinkage-ryu\n","note":"d. 1906","bg":"#ffffff","borderColor":"#cbd5e1","borderWidth":1,"radius":18,"padding":18,"text":{"heading":{"font":"Arial","size":20,"bold":true,"italic":false,"color":"#0f172a","align":"center"},"subheading":{"font":"Arial","size":14,"bold":false,"italic":false,"color":"#334155","align":"center"},"note":{"font":"Arial","size":12,"bold":false,"italic":false,"color":"#475569","align":"center"}},"profile":{"summary":"Preserved in Nikido’s internal genealogy as a collateral figure associated with Shinkage-ryū jūjutsu. A public ryūha reference describes Imaizumi Hachirō as the founder of a Meiji-period Shinkage-ryū centred on jūjutsu and hojojutsu. His exact relationship to Nikido’s principal teaching line remains unestablished, so he is shown as a collateral influence.","sources":[{"label":"Hojojutsu Research — Shinkage-ryū and Imaizumi Hachirō","url":"https://www.hojojutsu.org/ryuha"},{"label":"Eba Dojo — Shinkage-ryū jūjutsu","url":"https://ebadojo.weebly.com/125021252512464blog/shinkage-ryu-jujutsu"},{"label":"United States Ju-Jitsu Federation — early history of ju-jitsu","url":"https://www.usjjf.org/uploads/5/2/4/8/52481119/early_history_of_ju-jitsu_part_iii.pdf"}]}},{"id":"tile-2b0drxg4a8j","x":-20.969254950744528,"y":-1389.0273613950885,"w":407.1301751503338,"h":111.73620913090026,"heading":"Iso Mataemon Masatomo\r\n","subheading":"Tenjin Shin’yō-ryū -3rd Headmaster\n","note":"1818 - 1881","bg":"#ffffff","borderColor":"#cbd5e1","borderWidth":1,"radius":18,"padding":18,"text":{"heading":{"font":"Arial","size":20,"bold":true,"italic":false,"color":"#0f172a","align":"center"},"subheading":{"font":"Arial","size":14,"bold":false,"italic":false,"color":"#334155","align":"center"},"note":{"font":"Arial","size":12,"bold":false,"italic":false,"color":"#475569","align":"center"}},"profile":{"summary":"The third head of Tenjin Shin’yō-ryū, sustaining the school into the Meiji period. After Fukuda Hachinosuke’s death, Kanō Jigorō continued his Tenjin study with Masatomo, carrying the Iso inheritance into the formation of Kōdōkan Jūdō.","sources":[{"label":"Nihon Kobudō Kyōkai — Tenjin Shin’yō-ryū","url":"https://www.nihonkobudokyoukai.org/martialarts/005/"},{"label":"International Judo Federation — Kanō Jigorō","url":"https://www.ijf.org/history/hall-of-fame/96"},{"label":"Kotobank — Tenjin Shin’yō-ryū","url":"https://kotobank.jp/word/%E5%A4%A9%E7%A5%9E%E7%9C%9F%E6%A5%8A%E6%B5%81-102481"},{"label":"International Judo Federation — Jūdō history","url":"https://www.ijf.org/history"}]}},{"id":"tile-kuf2gbl9lvm","x":-20.969254950744528,"y":-1580.0529861050134,"w":407.1301751503338,"h":111.73620913090026,"heading":"Iso Mataichirō Masamitsu\r\n","subheading":"Tenjin Shin’yō-ryū -2nd Headmaster\n","note":"head 1857 - 1867.  D.1867, age 37","bg":"#ffffff","borderColor":"#cbd5e1","borderWidth":1,"radius":18,"padding":18,"text":{"heading":{"font":"Arial","size":20,"bold":true,"italic":false,"color":"#0f172a","align":"center"},"subheading":{"font":"Arial","size":14,"bold":false,"italic":false,"color":"#334155","align":"center"},"note":{"font":"Arial","size":12,"bold":false,"italic":false,"color":"#475569","align":"center"}},"profile":{"summary":"The founder’s son and second head of Tenjin Shin’yō-ryū. The internal genealogy places his life at approximately 1830–1867; his early death illustrates why senior licensed teachers and branch dōjō were also essential to preserving the tradition beyond a single household.","sources":[{"label":"Nihon Kobudō Kyōkai — Tenjin Shin’yō-ryū genealogy","url":"https://www.nihonkobudokyoukai.org/martialarts/005/"},{"label":"Kotobank — Tenjin Shin’yō-ryū","url":"https://kotobank.jp/word/%E5%A4%A9%E7%A5%9E%E7%9C%9F%E6%A5%8A%E6%B5%81-102481"},{"label":"Journal of Mind-Body Science — Edo-era jūjutsu study","url":"https://doi.org/10.20788/jmbs.1.1_89"}]}},{"id":"tile-m9phgsfbnkr","x":-20.969254950744528,"y":-1771.0786108149382,"w":407.1301751503338,"h":111.73620913090026,"heading":"Iso Mataemon Ryūkansai Masatari\r\n","subheading":"Founder: Tenjin Shin’yō-ryū\n","note":"c. 1790 - 1863.  Formed c.1820's-30's","bg":"#ffffff","borderColor":"#cbd5e1","borderWidth":1,"radius":18,"padding":18,"text":{"heading":{"font":"Arial","size":20,"bold":true,"italic":false,"color":"#0f172a","align":"center"},"subheading":{"font":"Arial","size":14,"bold":false,"italic":false,"color":"#334155","align":"center"},"note":{"font":"Arial","size":12,"bold":false,"italic":false,"color":"#475569","align":"center"}},"profile":{"summary":"Iso Masatari (born about 1787–1788; died 1863) combined Yōshin-ryū and Shin no Shintō-ryū in the 1820s to form Tenjin Shin’yō-ryū. The late-Edo school became known for close-quarter atemi, throws, locks, strangulations, vital-point study and restorative methods, with balance-breaking and adaptable structure at its centre.","sources":[{"label":"Nihon Kobudō Kyōkai — official school history","url":"https://www.nihonkobudokyoukai.org/martialarts/005/"},{"label":"Kotobank — Tenjin Shin’yō-ryū","url":"https://kotobank.jp/word/%E5%A4%A9%E7%A5%9E%E7%9C%9F%E6%A5%8A%E6%B5%81-102481"},{"label":"Journal of Mind-Body Science — Edo-era jūjutsu study","url":"https://doi.org/10.20788/jmbs.1.1_89"},{"label":"Meiji University — literary survey of jūjutsu kappō","url":"https://hdl.handle.net/10291/4119"}]}},{"id":"tile-yvno08ukxm1","x":240.23723177200213,"y":-2365.2207078309702,"w":407.1301751503338,"h":111.73620913090026,"heading":"Honma Jōemon Kanzan Masatō\r\n","subheading":"Shin no Shintō-ryū\n","note":"Dates unknown","bg":"#ffffff","borderColor":"#cbd5e1","borderWidth":1,"radius":18,"padding":18,"text":{"heading":{"font":"Arial","size":20,"bold":true,"italic":false,"color":"#0f172a","align":"center"},"subheading":{"font":"Arial","size":14,"bold":false,"italic":false,"color":"#334155","align":"center"},"note":{"font":"Arial","size":12,"bold":false,"italic":false,"color":"#475569","align":"center"}},"profile":{"summary":"The third named successor in the Shin no Shintō-ryū line and a crucial teacher of Iso Masatari. Honma transmitted the Shin no Shintō current that Iso later combined with the Yōshin-ryū instruction received from Hitotsuyanagi Oribe.","sources":[{"label":"Kotobank — Shin no Shintō-ryū","url":"https://kotobank.jp/word/%E7%9C%9F%E4%B9%8B%E7%A5%9E%E9%81%93%E6%B5%81-1547490"},{"label":"Nihon Kobudō Kyōkai — Tenjin Shin’yō-ryū","url":"https://www.nihonkobudokyoukai.org/martialarts/005/"},{"label":"Kotobank — Tenjin Shin’yō-ryū","url":"https://kotobank.jp/word/%E5%A4%A9%E7%A5%9E%E7%9C%9F%E6%A5%8A%E6%B5%81-102481"},{"label":"Journal of Mind-Body Science — Edo-era jūjutsu study","url":"https://doi.org/10.20788/jmbs.1.1_89"}]}},{"id":"tile-qktrqssn1kb","x":240.23723177200213,"y":-2562.114312017311,"w":407.1301751503338,"h":111.73620913090026,"heading":"Doi Mutansai Yasunobu\r\n","subheading":"Shin no Shintō-ryū\n","note":"Dates unknown","bg":"#ffffff","borderColor":"#cbd5e1","borderWidth":1,"radius":18,"padding":18,"text":{"heading":{"font":"Arial","size":20,"bold":true,"italic":false,"color":"#0f172a","align":"center"},"subheading":{"font":"Arial","size":14,"bold":false,"italic":false,"color":"#334155","align":"center"},"note":{"font":"Arial","size":12,"bold":false,"italic":false,"color":"#475569","align":"center"}},"profile":{"summary":"Named in the published Shin no Shintō-ryū genealogy as Yamamoto’s second successor. Doi stands in the direct sequence through which the revised Yōshin-derived curriculum passed to Honma Jōemon and ultimately into Iso Masatari’s formation of Tenjin Shin’yō-ryū.","sources":[{"label":"Kotobank — Shin no Shintō-ryū","url":"https://kotobank.jp/word/%E7%9C%9F%E4%B9%8B%E7%A5%9E%E9%81%93%E6%B5%81-1547490"},{"label":"Nihon Kobudō Kyōkai — Tenjin Shin’yō-ryū","url":"https://www.nihonkobudokyoukai.org/martialarts/005/"},{"label":"Kotobank — Tenjin Shin’yō-ryū","url":"https://kotobank.jp/word/%E5%A4%A9%E7%A5%9E%E7%9C%9F%E6%A5%8A%E6%B5%81-102481"}]}},{"id":"tile-0f64yicniui","x":240.23723177200213,"y":-2756.3063262102405,"w":407.1301751503338,"h":111.73620913090026,"heading":"Yamamoto Minzaemon Hidehaya\r\n","subheading":"Founder: Shin no Shintō-ryū C.1751\n","note":"1715 - 1798","bg":"#ffffff","borderColor":"#cbd5e1","borderWidth":1,"radius":18,"padding":18,"text":{"heading":{"font":"Arial","size":20,"bold":true,"italic":false,"color":"#0f172a","align":"center"},"subheading":{"font":"Arial","size":14,"bold":false,"italic":false,"color":"#334155","align":"center"},"note":{"font":"Arial","size":12,"bold":false,"italic":false,"color":"#475569","align":"center"}},"profile":{"summary":"Yamamoto Minzaemon Hidehaya (1715–1798) is credited with establishing Shin no Shintō-ryū around 1751 after studying Yōshin-ryū with Hagiwara Gōemon. Reference accounts describe him reorganising a larger inheritance into eighty-seven techniques across four levels, preserving the principle of jū in a revised instructional system.","sources":[{"label":"Kotobank — Shin no Shintō-ryū","url":"https://kotobank.jp/word/%E7%9C%9F%E4%B9%8B%E7%A5%9E%E9%81%93%E6%B5%81-1547490"},{"label":"Nihon Kobudō Kyōkai — Tenjin Shin’yō-ryū","url":"https://www.nihonkobudokyoukai.org/martialarts/005/"},{"label":"Journal of Mind-Body Science — Edo-era jūjutsu study","url":"https://doi.org/10.20788/jmbs.1.1_89"}]}},{"id":"tile-ykv4flzo070","x":240.23723177200213,"y":-2947.048868842598,"w":407.1301751503338,"h":111.73620913090026,"heading":"Hagiwara Gōemon Motoyoshi\r\n","subheading":"Yōshin-ryū\n","note":"Dates unknown","bg":"#ffffff","borderColor":"#cbd5e1","borderWidth":1,"radius":18,"padding":18,"text":{"heading":{"font":"Arial","size":20,"bold":true,"italic":false,"color":"#0f172a","align":"center"},"subheading":{"font":"Arial","size":14,"bold":false,"italic":false,"color":"#334155","align":"center"},"note":{"font":"Arial","size":12,"bold":false,"italic":false,"color":"#475569","align":"center"}},"profile":{"summary":"A Yōshin-ryū teacher identified as the instructor of Yamamoto Minzaemon Hidehaya. Through Yamamoto, this current was reorganised as Shin no Shintō-ryū and later became one of the two principal streams combined by Iso Masatari in Tenjin Shin’yō-ryū.","sources":[{"label":"Kotobank — Shin no Shintō-ryū","url":"https://kotobank.jp/word/%E7%9C%9F%E4%B9%8B%E7%A5%9E%E9%81%93%E6%B5%81-1547490"},{"label":"Kotobank — Yōshin-ryū","url":"https://kotobank.jp/word/%E6%A5%8A%E5%BF%83%E6%B5%81-653105"},{"label":"Nihon Kobudō Kyōkai — Tenjin Shin’yō-ryū","url":"https://www.nihonkobudokyoukai.org/martialarts/005/"},{"label":"Journal of Mind-Body Science — Edo-era jūjutsu study","url":"https://doi.org/10.20788/jmbs.1.1_89"}]}},{"id":"tile-bonzt20qyow","x":-282.1757416734911,"y":-2947.0488688425976,"w":407.1301751503338,"h":111.73620913090026,"heading":"Later Yōshin-ryū generations\r\n","subheading":"Names not securely identified \n","note":"","bg":"#ffffff","borderColor":"#cbd5e1","borderWidth":1,"radius":18,"padding":18,"text":{"heading":{"font":"Arial","size":20,"bold":true,"italic":false,"color":"#0f172a","align":"center"},"subheading":{"font":"Arial","size":14,"bold":false,"italic":false,"color":"#334155","align":"center"},"note":{"font":"Arial","size":12,"bold":false,"italic":false,"color":"#475569","align":"center"}},"profile":{"summary":"This tile marks a genuine gap in the surviving named genealogy between early Yōshin figures and later documented branches. The missing names should not be replaced by conjecture: the record is best understood as inherited school tradition whose complete personal succession is no longer securely identified.","sources":[{"label":"Kotobank — Yōshin-ryū","url":"https://kotobank.jp/word/%E6%A5%8A%E5%BF%83%E6%B5%81-653105"},{"label":"Kotobank — Akiyama Yoshitoki","url":"https://kotobank.jp/word/%E7%A7%8B%E5%B1%B1%E7%BE%A9%E6%99%82-1049267"},{"label":"Journal of Mind-Body Science — Edo-era jūjutsu study","url":"https://doi.org/10.20788/jmbs.1.1_89"},{"label":"Meiji University — literary survey of jūjutsu kappō","url":"https://hdl.handle.net/10291/4119"}]}},{"id":"tile-0lttpe5s901","x":-282.1757416734911,"y":-2293.619932776708,"w":407.1301751503338,"h":111.73620913090026,"heading":"Hitotsuyanagi Oribe Yoshimichi\r","subheading":"Yōshin-ryū\n","note":"Dates unknown","bg":"#ffffff","borderColor":"#cbd5e1","borderWidth":1,"radius":18,"padding":18,"text":{"heading":{"font":"Arial","size":20,"bold":true,"italic":false,"color":"#0f172a","align":"center"},"subheading":{"font":"Arial","size":14,"bold":false,"italic":false,"color":"#334155","align":"center"},"note":{"font":"Arial","size":12,"bold":false,"italic":false,"color":"#475569","align":"center"}},"profile":{"summary":"Iso Masatari’s teacher in a Yōshin-ryū stream distinct from the Hagiwara–Yamamoto branch. This instruction converged in Iso with Honma Jōemon’s Shin no Shintō-ryū, providing the two principal currents reorganised as Tenjin Shin’yō-ryū.","sources":[{"label":"Nihon Kobudō Kyōkai — Tenjin Shin’yō-ryū","url":"https://www.nihonkobudokyoukai.org/martialarts/005/"},{"label":"Kotobank — Tenjin Shin’yō-ryū","url":"https://kotobank.jp/word/%E5%A4%A9%E7%A5%9E%E7%9C%9F%E6%A5%8A%E6%B5%81-102481"},{"label":"Kotobank — Yōshin-ryū","url":"https://kotobank.jp/word/%E6%A5%8A%E5%BF%83%E6%B5%81-653105"},{"label":"Journal of Mind-Body Science — Edo-era jūjutsu study","url":"https://doi.org/10.20788/jmbs.1.1_89"}]}},{"id":"tile-7jl4rbmwvgb","x":1011.7603535086923,"y":-1771.0786108149382,"w":407.1301751503338,"h":111.73620913090026,"heading":"Fukuda Hachinosuke\r\n","subheading":"Tenjin Shin’yō-ryū\r\n","note":"1828–1879 · Kanō entered 1877\r\n","bg":"#ffffff","borderColor":"#cbd5e1","borderWidth":1,"radius":18,"padding":18,"text":{"heading":{"font":"Arial","size":20,"bold":true,"italic":false,"color":"#0f172a","align":"center"},"subheading":{"font":"Arial","size":14,"bold":false,"italic":false,"color":"#334155","align":"center"},"note":{"font":"Arial","size":12,"bold":false,"italic":false,"color":"#475569","align":"center"}},"profile":{"summary":"Kanō Jigorō’s first Tenjin Shin’yō-ryū teacher, beginning in 1877. Fukuda’s practical approach helped expose Kanō to close grappling and practice beyond formal choreography; after Fukuda’s death in 1879, Kanō continued in the tradition under Iso Masatomo.","sources":[{"label":"International Judo Federation — Kanō Jigorō","url":"https://www.ijf.org/history/hall-of-fame/96"},{"label":"International Judo Federation — history","url":"https://www.ijf.org/history"},{"label":"International Judo Federation — the need to study kata","url":"https://www.ijf.org/news/show/the-need-to-study-kata"},{"label":"Japanese Olympic Committee — Kanō Jigorō","url":"https://www.joc.or.jp/english/historyjapan/kano_jigoro06.html"}]}},{"id":"tile-d13k6nqyaw0","x":1252.8445669803764,"y":-1580.0529861050134,"w":406.6055843963975,"h":148.26795079056706,"heading":"Kanō Jigorō\r\n","subheading":"Tenjin Shin’yō-ryū + Kitō-ryū\n","note":"1860 - 1938\nFounder: Kōdōkan Judo\r 1882\n","bg":"#ffffff","borderColor":"#cbd5e1","borderWidth":1,"radius":18,"padding":18,"text":{"heading":{"font":"Arial","size":20,"bold":true,"italic":false,"color":"#0f172a","align":"center"},"subheading":{"font":"Arial","size":14,"bold":false,"italic":false,"color":"#334155","align":"center"},"note":{"font":"Arial","size":12,"bold":false,"italic":false,"color":"#475569","align":"center"}},"profile":{"summary":"Kanō Jigorō (1860–1938) synthesised classical jūjutsu study under Fukuda Hachinosuke, Iso Masatomo and Iikubo Tsunetoshi into Kōdōkan Jūdō, founded in 1882. He reorganised training around safe falling, randori, kata, technical analysis, efficient use of energy and mutual welfare, creating an educational system with global influence.","sources":[{"label":"International Judo Federation — Kanō Jigorō","url":"https://www.ijf.org/history/hall-of-fame/96"},{"label":"International Judo Federation — Jūdō history","url":"https://www.ijf.org/history"},{"label":"International Judo Federation — the need to study kata","url":"https://www.ijf.org/news/show/the-need-to-study-kata"},{"label":"Research Journal of Budo — Kanō and atemi-waza","url":"https://doi.org/10.11214/budo.52.39"},{"label":"Japanese Olympic Committee — Kanō Jigorō","url":"https://www.joc.or.jp/english/historyjapan/kano_jigoro06.html"}]}},{"id":"tile-zp0ui5f1syz","x":1504.9667519574014,"y":-1771.0786108149382,"w":407.1301751503338,"h":111.73620913090026,"heading":"Iikubo Tsunetoshi\r\n","subheading":"Kitō-ryū\r\n","note":"1835–1889 · taught Kanō from 1881\r\n\n","bg":"#ffffff","borderColor":"#cbd5e1","borderWidth":1,"radius":18,"padding":18,"text":{"heading":{"font":"Arial","size":20,"bold":true,"italic":false,"color":"#0f172a","align":"center"},"subheading":{"font":"Arial","size":14,"bold":false,"italic":false,"color":"#334155","align":"center"},"note":{"font":"Arial","size":12,"bold":false,"italic":false,"color":"#475569","align":"center"}},"profile":{"summary":"Kanō Jigorō’s teacher in Kitō-ryū. Iikubo contributed a sophisticated throwing and body-management inheritance to Kanō’s developing synthesis, complementing the Tenjin Shin’yō-ryū instruction Kanō received from Fukuda Hachinosuke and Iso Masatomo.","sources":[{"label":"International Judo Federation — Kanō Jigorō","url":"https://www.ijf.org/history/hall-of-fame/96"},{"label":"International Judo Federation — history","url":"https://www.ijf.org/history"},{"label":"International Judo Federation — the need to study kata","url":"https://www.ijf.org/news/show/the-need-to-study-kata"},{"label":"Japanese Olympic Committee — Kanō Jigorō","url":"https://www.joc.or.jp/english/historyjapan/kano_jigoro06.html"}]}},{"id":"tile-2s3hf7pm39p","x":-282.1757416734911,"y":-3170.1198884668106,"w":407.1301751503338,"h":111.73620913090026,"heading":"Ōe Senbei Yoshitoki\r\n","subheading":"Yōshin-ryū · systematiser\r","note":"Dates unknown","bg":"#ffffff","borderColor":"#cbd5e1","borderWidth":1,"radius":18,"padding":18,"text":{"heading":{"font":"Arial","size":20,"bold":true,"italic":false,"color":"#0f172a","align":"center"},"subheading":{"font":"Arial","size":14,"bold":false,"italic":false,"color":"#334155","align":"center"},"note":{"font":"Arial","size":12,"bold":false,"italic":false,"color":"#475569","align":"center"}},"profile":{"summary":"Remembered in Yōshin-ryū accounts as a major systematiser or “second founder.” His importance lies in turning an inherited body of practice into a teachable structure of named methods, levels and standards, helping individual skill become an enduring school tradition.","sources":[{"label":"Kotobank — Yōshin-ryū","url":"https://kotobank.jp/word/%E6%A5%8A%E5%BF%83%E6%B5%81-653105"},{"label":"Journal of Mind-Body Science — Edo-era jūjutsu study","url":"https://doi.org/10.20788/jmbs.1.1_89"},{"label":"Meiji University — literary survey of jūjutsu kappō","url":"https://hdl.handle.net/10291/4119"}]}},{"id":"tile-5if6hijmyxi","x":-282.1757416734911,"y":-3402.8860415450704,"w":407.1301751503338,"h":111.73620913090026,"heading":"Akiyama Shirōbei Yoshitoki\r\n","subheading":"Founder: Yōshin-ryū\n","note":"Active 17th century.  D. c. 1680","bg":"#ffffff","borderColor":"#cbd5e1","borderWidth":1,"radius":18,"padding":18,"text":{"heading":{"font":"Arial","size":20,"bold":true,"italic":false,"color":"#0f172a","align":"center"},"subheading":{"font":"Arial","size":14,"bold":false,"italic":false,"color":"#334155","align":"center"},"note":{"font":"Arial","size":12,"bold":false,"italic":false,"color":"#475569","align":"center"}},"profile":{"summary":"An early-Edo figure associated with the founding tradition of Yōshin-ryū. The school’s best-known origin story places Akiyama beneath a willow that bent under snow and recovered, making resilient flexibility—not passive softness—the organising image of the tradition. The biography and chronology remain partly traditional rather than fully documented.","sources":[{"label":"Kotobank — Akiyama Yoshitoki","url":"https://kotobank.jp/word/%E7%A7%8B%E5%B1%B1%E7%BE%A9%E6%99%82-1049267"},{"label":"Kotobank — Yōshin-ryū","url":"https://kotobank.jp/word/%E6%A5%8A%E5%BF%83%E6%B5%81-653105"},{"label":"Journal of Mind-Body Science — Edo-era jūjutsu study","url":"https://doi.org/10.20788/jmbs.1.1_89"},{"label":"Meiji University — literary survey of jūjutsu kappō","url":"https://hdl.handle.net/10291/4119"}]}},{"id":"tile-vmy17lyr2ab","x":2099.1257164822055,"y":-1310.6527830622015,"w":407.1301751503338,"h":111.73620913090026,"heading":"Totsuka Hikosuke Hidetoshi\r\n","subheading":"Totsuka-ha Yōshin-ryū\r\n","note":"1813–1886 · taught Matsuoka c.1860–62\r\n","bg":"#ffffff","borderColor":"#cbd5e1","borderWidth":1,"radius":18,"padding":18,"text":{"heading":{"font":"Arial","size":20,"bold":true,"italic":false,"color":"#0f172a","align":"center"},"subheading":{"font":"Arial","size":14,"bold":false,"italic":false,"color":"#334155","align":"center"},"note":{"font":"Arial","size":12,"bold":false,"italic":false,"color":"#475569","align":"center"}},"profile":{"summary":"A senior figure of the Totsuka-line Yōshin-ryū current associated with Matsuoka Katsunosuke’s martial development. The network of licences surrounding Matsuoka was more complex than a single descending line, but Totsuka’s branch formed one of the recognised jūjutsu inputs to Shindō Yōshin-ryū.","sources":[{"label":"Shinyokai — history of Shindō Yōshin-ryū","url":"https://www.shinyokai.com/history.php"},{"label":"Wadō-ryū Karate-dō Renmei — Meiji history","url":"https://www.wado-ryu.jp/histor/meiji_01.html"},{"label":"Wadō-ryū Karate-dō Renmei — history and philosophy","url":"https://www.wado-ryu.jp/en/data/history.pdf"}]}},{"id":"tile-rn1b1cas2r7","x":2099.1257164822055,"y":-1113.7325448057939,"w":407.1301751503338,"h":111.73620913090026,"heading":"Matsuoka Katsunosuke\r\n","subheading":"Founder: Shindō Yōshin-ryū \n","note":"1836–1898 · founded 1864\r\n","bg":"#ffffff","borderColor":"#cbd5e1","borderWidth":1,"radius":18,"padding":18,"text":{"heading":{"font":"Arial","size":20,"bold":true,"italic":false,"color":"#0f172a","align":"center"},"subheading":{"font":"Arial","size":14,"bold":false,"italic":false,"color":"#334155","align":"center"},"note":{"font":"Arial","size":12,"bold":false,"italic":false,"color":"#475569","align":"center"}},"profile":{"summary":"Matsuoka Katsunosuke founded Shindō Yōshin-ryū in 1864. Organisational histories describe an integrated synthesis drawing on Tenjin Shin’yō-ryū, Totsuka-line Yōshin-ryū, sword and spear traditions. Its natural movement, line control and weapon-informed body mechanics later became foundational to Ōtsuka Hironori’s Wadō-ryū.","sources":[{"label":"Shinyokai — history of Shindō Yōshin-ryū","url":"https://www.shinyokai.com/history.php"},{"label":"Wadō-ryū Karate-dō Renmei — Meiji history","url":"https://www.wado-ryu.jp/histor/meiji_01.html"},{"label":"Wadō-ryū Karate-dō Renmei — history and philosophy","url":"https://www.wado-ryu.jp/en/data/history.pdf"},{"label":"Wadō-ryū Karate-dō Federation — history","url":"https://www.karatedo.co.jp/wado/w_eng/e_hist.htm"}]}},{"id":"tile-19fvlrtunlr","x":1098.7748089394686,"y":-556.804674086728,"w":407.1301751503338,"h":111.73620913090026,"heading":"Sakakibara Kenkichi\r\n","subheading":"Jikishinkage-ryū kenjutsu\r\n","note":"1830–1894\n","bg":"#ffffff","borderColor":"#cbd5e1","borderWidth":1,"radius":18,"padding":18,"text":{"heading":{"font":"Arial","size":20,"bold":true,"italic":false,"color":"#0f172a","align":"center"},"subheading":{"font":"Arial","size":14,"bold":false,"italic":false,"color":"#334155","align":"center"},"note":{"font":"Arial","size":12,"bold":false,"italic":false,"color":"#475569","align":"center"}},"profile":{"summary":"A celebrated Jikishinkage-ryū swordsman of the late Tokugawa and early Meiji periods. Takeda Sōkaku lived and trained in Sakakibara’s dōjō from 1873 to 1876, making this relationship an important sword connection in the wider ancestry of Daitō-ryū and Aikidō. Nikido’s genealogy also records Sakakibara as a collateral influence around Matsuoka’s network.","sources":[{"label":"Daitō-ryū headquarters — Takeda Sōkaku","url":"https://www.daito-ryu.org/en/takeda-sokaku.html"},{"label":"Shinyokai — Shindō Yōshin-ryū history","url":"https://www.shinyokai.com/history.php"},{"label":"Daitō-ryū headquarters — Daitō-ryū and Aikidō","url":"https://www.daito-ryu.org/en/daito-ryu-and-aikido.html"},{"label":"Wadō-ryū Karate-dō Renmei — history and philosophy","url":"https://www.wado-ryu.jp/en/data/history.pdf"}]}},{"id":"tile-2f6a848w3v3","x":1578.99921799221,"y":-556.804674086728,"w":407.1301751503338,"h":111.73620913090026,"heading":"Various Karate Teachers\n","subheading":"Funakoshi · Mabuni · Motobu\r\n","note":"instruction/contact 1922–29\r\n","bg":"#ffffff","borderColor":"#cbd5e1","borderWidth":1,"radius":18,"padding":18,"text":{"heading":{"font":"Arial","size":20,"bold":true,"italic":false,"color":"#0f172a","align":"center"},"subheading":{"font":"Arial","size":14,"bold":false,"italic":false,"color":"#334155","align":"center"},"note":{"font":"Arial","size":12,"bold":false,"italic":false,"color":"#475569","align":"center"}},"profile":{"summary":"This tile represents Ōtsuka Hironori’s formative encounters with Okinawan karate teachers: Funakoshi Gichin from 1922, followed by study or exchange with Mabuni Kenwa and Motobu Chōki. Their kata, technical analysis and practical striking were interpreted through Ōtsuka’s existing Shindō Yōshin-ryū body method rather than simply appended to it.","sources":[{"label":"Wadō-ryū Karate-dō Renmei — Taishō history","url":"https://www.wado-ryu.jp/histor/taisho.html"},{"label":"Wadō-ryū Karate-dō Renmei — Shōwa history","url":"https://www.wado-ryu.jp/histor/showa.html"},{"label":"Wadō-ryū Karate-dō Renmei — history and philosophy","url":"https://www.wado-ryu.jp/en/data/history.pdf"},{"label":"Wadō-ryū Karate-dō Federation — history","url":"https://www.karatedo.co.jp/wado/w_eng/e_hist.htm"}]}},{"id":"tile-4qtteplxoud","x":2099.1257164822055,"y":-921.0970599223949,"w":407.1301751503338,"h":111.73620913090026,"heading":"Inose Motokichi\r\n","subheading":"Shindō Yōshin-ryū · branch head\r\n","note":"1852–1921 · head from 1895\n","bg":"#ffffff","borderColor":"#cbd5e1","borderWidth":1,"radius":18,"padding":18,"text":{"heading":{"font":"Arial","size":20,"bold":true,"italic":false,"color":"#0f172a","align":"center"},"subheading":{"font":"Arial","size":14,"bold":false,"italic":false,"color":"#334155","align":"center"},"note":{"font":"Arial","size":12,"bold":false,"italic":false,"color":"#475569","align":"center"}},"profile":{"summary":"A major figure in the post-1895 branching of Shindō Yōshin-ryū. Wadō institutional histories commonly trace Matsuoka through Inose to Nakayama Tatsusaburō, while Shinyokai records distinct main and branch lines. His position is therefore best described as consequential branch headship rather than a universally agreed single succession.","sources":[{"label":"Shinyokai — history of Shindō Yōshin-ryū","url":"https://www.shinyokai.com/history.php"},{"label":"Wadō-ryū Karate-dō Renmei — Meiji history","url":"https://www.wado-ryu.jp/histor/meiji_01.html"},{"label":"Wadō-ryū Karate-dō Renmei — Taishō history","url":"https://www.wado-ryu.jp/histor/taisho.html"},{"label":"Wadō-ryū Karate-dō Renmei — history and philosophy","url":"https://www.wado-ryu.jp/en/data/history.pdf"}]}},{"id":"tile-j6jcuucykz6","x":2099.650307236142,"y":-743.3218396723652,"w":407.1301751503338,"h":111.73620913090026,"heading":"Nakayama Tatsusaburō\r\n","subheading":"Shindō Yōshin-ryū \n","note":"1870 - 1945\n","bg":"#ffffff","borderColor":"#cbd5e1","borderWidth":1,"radius":18,"padding":18,"text":{"heading":{"font":"Arial","size":20,"bold":true,"italic":false,"color":"#0f172a","align":"center"},"subheading":{"font":"Arial","size":14,"bold":false,"italic":false,"color":"#334155","align":"center"},"note":{"font":"Arial","size":12,"bold":false,"italic":false,"color":"#475569","align":"center"}},"profile":{"summary":"A highly licensed Shindō Yōshin-ryū teacher under whom Ōtsuka Hironori began training in 1905. Nakayama gave Ōtsuka a mature jūjutsu foundation before his encounter with Okinawan karate, making body movement, paired practice, timing and weapon-informed line central to the later Wadō synthesis.","sources":[{"label":"Shinyokai — history of Shindō Yōshin-ryū","url":"https://www.shinyokai.com/history.php"},{"label":"Wadō-ryū Karate-dō Renmei — Taishō history","url":"https://www.wado-ryu.jp/histor/taisho.html"},{"label":"Wadō-ryū Karate-dō Renmei — Shōwa history","url":"https://www.wado-ryu.jp/histor/showa.html"},{"label":"Wadō-ryū Karate-dō Renmei — history and philosophy","url":"https://www.wado-ryu.jp/en/data/history.pdf"}]}},{"id":"tile-pl5zmol063t","x":2099.1257164822055,"y":-556.8046740867279,"w":473.2156631400335,"h":174.24144494960018,"heading":"Hironori Ōtsuka\n","subheading":"Shindō Yōshin-ryū + Karate\nFounder: Wadō-ryū Karate c. 1928-29","note":"1870 - 1945\n","bg":"#ffffff","borderColor":"#cbd5e1","borderWidth":1,"radius":18,"padding":18,"text":{"heading":{"font":"Arial","size":20,"bold":true,"italic":false,"color":"#0f172a","align":"center"},"subheading":{"font":"Arial","size":14,"bold":false,"italic":false,"color":"#334155","align":"center"},"note":{"font":"Arial","size":12,"bold":false,"italic":false,"color":"#475569","align":"center"}},"profile":{"summary":"Ōtsuka Hironori (1892–1982) received advanced Shindō Yōshin-ryū licensing around 1920–1921 before studying Okinawan karate. He fused jūjutsu body movement, evasion, line and timing with karate striking, developing the art that became Wadō-ryū through institutional stages in the 1930s and 1940.","sources":[{"label":"Wadō-ryū Karate-dō Renmei — history","url":"https://www.wado-ryu.jp/histor/showa.html"},{"label":"Wadō-ryū Karate-dō Federation — history","url":"https://www.karatedo.co.jp/wado/w_eng/e_hist.htm"},{"label":"Shinyokai — history of Shindō Yōshin-ryū","url":"https://www.shinyokai.com/history.php"},{"label":"Wadō-ryū Karate-dō Renmei — history and philosophy","url":"https://www.wado-ryu.jp/en/data/history.pdf"}]}},{"id":"tile-pq9sgst7zrd","x":1098.7748089394686,"y":-175.915680745563,"w":407.1301751503338,"h":111.73620913090026,"heading":"Takeda Sōkaku\n","subheading":"Daitō-ryū Aiki-jūjutsu\n","note":"1859 - 1943\n","bg":"#ffffff","borderColor":"#cbd5e1","borderWidth":1,"radius":18,"padding":18,"text":{"heading":{"font":"Arial","size":20,"bold":true,"italic":false,"color":"#0f172a","align":"center"},"subheading":{"font":"Arial","size":14,"bold":false,"italic":false,"color":"#334155","align":"center"},"note":{"font":"Arial","size":12,"bold":false,"italic":false,"color":"#475569","align":"center"}},"profile":{"summary":"Takeda Sōkaku (1859–1943) was the historically visible public transmitter and reviver of Daitō-ryū. His extensive travelling instruction and preserved enrolment records spread an approach centred on taking structure at contact and controlling the whole body through precise changes of line and joint relationship. Ueshiba Morihei became one of his most consequential students.","sources":[{"label":"Daitō-ryū headquarters — Takeda Sōkaku","url":"https://www.daito-ryu.org/en/takeda-sokaku.html"},{"label":"Daitō-ryū headquarters — Daitō-ryū and Aikidō","url":"https://www.daito-ryu.org/en/daito-ryu-and-aikido.html"},{"label":"Aikikai Foundation — history of Aikidō","url":"https://aikikai.or.jp/eng/aikido/history/"},{"label":"Aikikai Foundation — about Aikidō","url":"https://aikikai.or.jp/eng/aikido/"}]}},{"id":"tile-jqmksqf9jvg","x":1076.8832324664588,"y":2.1686769530914063,"w":450.9133280963533,"h":196.28960900502668,"heading":"Morihei Ueshiba\n","subheading":"Daitō-ryū-derived aiki practice\n","note":"1883 - 1969\nFounder: Aikido - developed during 1920's - 30's","bg":"#ffffff","borderColor":"#cbd5e1","borderWidth":1,"radius":18,"padding":18,"text":{"heading":{"font":"Arial","size":20,"bold":true,"italic":false,"color":"#0f172a","align":"center"},"subheading":{"font":"Arial","size":14,"bold":false,"italic":false,"color":"#334155","align":"center"},"note":{"font":"Arial","size":12,"bold":false,"italic":false,"color":"#475569","align":"center"}},"profile":{"summary":"Ueshiba Morihei (1883–1969) met Takeda Sōkaku in Hokkaidō in 1915 and studied Daitō-ryū intensively, receiving teaching authority in 1922. He gradually reshaped that foundation through religious, ethical and technical development; the name Aikidō was officially adopted in 1942. Weapon-informed entering, turning, balance control and reconciliation became hallmarks of the mature art.","sources":[{"label":"Aikikai Foundation — history of Aikidō","url":"https://aikikai.or.jp/eng/aikido/history/"},{"label":"Daitō-ryū headquarters — Daitō-ryū and Aikidō","url":"https://www.daito-ryu.org/en/daito-ryu-and-aikido.html"},{"label":"Aikikai Foundation — about Aikidō","url":"https://aikikai.or.jp/eng/aikido/"},{"label":"Aikido Journal — the Iwama Aikidō conundrum","url":"https://aikidojournal.com/2016/01/26/the-iwama-aikido-conundrum-by-stanley-pranin-3/"},{"label":"Aikido Journal — Tokusaburō Tozawa","url":"https://aikidojournal.com/2011/08/27/tokusaburo-tozawa/"}]}},{"id":"tile-u0ccmashkvd","x":3067.73371304931,"y":-1227.0447955301324,"w":406.6055843963975,"h":148.26795079056706,"heading":" Mitsuyo Maeda\n","subheading":"Kōdōkan Judo\n","note":"1860 - 1938\nTook Jodu to Brazil in 1914","bg":"#ffffff","borderColor":"#cbd5e1","borderWidth":1,"radius":18,"padding":18,"text":{"heading":{"font":"Arial","size":20,"bold":true,"italic":false,"color":"#0f172a","align":"center"},"subheading":{"font":"Arial","size":14,"bold":false,"italic":false,"color":"#334155","align":"center"},"note":{"font":"Arial","size":12,"bold":false,"italic":false,"color":"#475569","align":"center"}},"profile":{"summary":"Mitsuyo Maeda (1878–1941), also known as Conde Koma, was a Kōdōkan judoka, travelling demonstrator and professional fighter whose career carried Japanese grappling to Brazil. He is central to the received Carlos Gracie lineage, although modern historical scholarship cautions that the precise routes of early Brazilian instruction were broader than a single simple origin story.","sources":[{"label":"Academic history — origins of Brazilian Jūdō","url":"https://www.scielo.br/j/rbefe/a/rsrMqNqf8TRqKZdHtRsbB4f/"},{"label":"Gracie Barra — Maeda and Carlos Gracie","url":"https://graciebarra.com/oceania/news/the-origins-of-jiu-jitsu-the-history-behind-the-art/"},{"label":"Gracie Museum — history preview","url":"https://www.graciemuseum.com/preview.pdf"},{"label":"Gracie Barra — Mitsuyo Maeda","url":"https://online.graciebarra.com/pages/blog?p=mitsuyo-maeda-the-master-who-brought-jiu-jitsu-to-brazil"}]}},{"id":"tile-1utaxoio6tv","x":3067.73371304931,"y":-957.6288015820617,"w":406.6055843963975,"h":148.26795079056706,"heading":"Carlos Gracie\n","subheading":"Founder: Brazilian Jiu Jitsu\n","note":"","bg":"#ffffff","borderColor":"#cbd5e1","borderWidth":1,"radius":18,"padding":18,"text":{"heading":{"font":"Arial","size":20,"bold":true,"italic":false,"color":"#0f172a","align":"center"},"subheading":{"font":"Arial","size":14,"bold":false,"italic":false,"color":"#334155","align":"center"},"note":{"font":"Arial","size":12,"bold":false,"italic":false,"color":"#475569","align":"center"}},"profile":{"summary":"Carlos Gracie (1902–1994) became a central organiser and teacher in the development of Brazilian Jiu-Jitsu. The received tradition links his early training in Belém to Mitsuyo Maeda’s circle, and Carlos later established a Gracie academy in Rio in 1925. Historical research notes that early Brazilian grappling involved several Japanese teachers and transmission routes.","sources":[{"label":"Academic history — origins of Brazilian Jūdō","url":"https://www.scielo.br/j/rbefe/a/rsrMqNqf8TRqKZdHtRsbB4f/"},{"label":"Gracie Barra — origins of Jiu-Jitsu","url":"https://graciebarra.com/oceania/news/the-origins-of-jiu-jitsu-the-history-behind-the-art/"},{"label":"Gracie Museum — history preview","url":"https://www.graciemuseum.com/preview.pdf"},{"label":"Gracie Barra — Mitsuyo Maeda","url":"https://online.graciebarra.com/pages/blog?p=mitsuyo-maeda-the-master-who-brought-jiu-jitsu-to-brazil"}]}},{"id":"tile-fgvh0a7x1gr","x":-20.96925495074447,"y":830.1920496212911,"w":407.1301751503338,"h":111.73620913090026,"heading":"Tim Bates","subheading":"1st Dan Nikido Ju Jutsu","note":"","bg":"#ffffff","borderColor":"#cbd5e1","borderWidth":1,"radius":18,"padding":18,"text":{"heading":{"font":"Arial","size":20,"bold":true,"italic":false,"color":"#0f172a","align":"center"},"subheading":{"font":"Arial","size":14,"bold":false,"italic":false,"color":"#334155","align":"center"},"note":{"font":"Arial","size":12,"bold":false,"italic":false,"color":"#475569","align":"center"}},"profile":{"summary":"","sources":[]}},{"id":"tile-d5lh11cxme
